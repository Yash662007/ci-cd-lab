<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <input type="number" id="a" placeholder="A" />
    <input type="number" id="b" placeholder="B" />
    <div class="buttons">
      <button onclick="calc('add')">+</button>
      <button onclick="calc('subtract')">−</button>
      <button onclick="calc('multiply')">×</button>
      <button onclick="calc('divide')">÷</button>
    </div>
    <div id="result">Result: —</div>
  </div>
  <script src="calculator.js"></script>
  <script>
    function calc(op) {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      try {
        const res = { add, subtract, multiply, divide }[op](a, b);
        document.getElementById('result').textContent = 'Result: ' + res;
      } catch (e) {
        document.getElementById('result').textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
